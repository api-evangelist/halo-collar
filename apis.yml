aid: halo-collar
name: Halo Collar
description: 'Halo Collar is the consumer GPS dog-fence and dog-tracking product built by
  Protect Animals With Satellites LLC (d/b/a Halo), founded in 2017 by Ken Ehrman, Michael
  Ehrman and dog behaviorist Cesar Millan. The product pairs a cellular- and GPS-connected
  smart collar (currently Halo Collar 5, with Halo Collar 4 still sold) with a companion
  iOS/Android app that lets an owner draw virtual GPS fences, watch real-time location,
  trigger Cesar Millan-designed training feedback, and read activity reports. The service
  runs on a required Pack Membership subscription in Bronze, Silver and Gold tiers that
  carries unlimited cellular data, an increasing virtual-fence allowance, accessory
  discounts and third-party partner perks. Halo publishes no public developer program: the
  app is served by a first-party, undocumented backend at api.halocollar.com (an ASP.NET
  service that self-identifies as Halo.Web.Api), and there is no developer portal, API
  reference, OpenAPI/AsyncAPI/GraphQL contract, SDK or webhook surface anywhere on the
  company''s public web properties.'
